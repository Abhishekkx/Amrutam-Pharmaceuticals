name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: amrutam_user
          POSTGRES_PASSWORD: amrutam_pass
          POSTGRES_DB: amrutam_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Checking
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint || true

      - name: Run Prisma Client Generation
        run: npx prisma generate

      - name: Run Automated Tests
        run: npm test
        env:
          DATABASE_URL: postgresql://amrutam_user:amrutam_pass@localhost:5432/amrutam_db?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci_jwt_secret_12345
          JWT_REFRESH_SECRET: ci_jwt_refresh_secret_12345

      - name: Build Application
        run: npm run build
